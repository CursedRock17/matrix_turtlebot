bt_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: true
    # Stock tree that replans only when the path becomes blocked or the goal
    # changes (IsPathValid is a cheap cell-walk); the default tree re-ran
    # NavFn over the full 2496x745 first_floor map every second, a constant
    # CPU tax on the already-saturated laptop (2026-07-10 efficiency pass).
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml"
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 30
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    # 10 Hz, not the 20 default: the laptop demonstrably can't hold 20
    # (2.3-8.3 Hz achieved, 2026-07-02 run) and a missed declared rate just
    # adds jitter warnings and starves other nodes. At the 0.26 m/s cap,
    # 10 Hz is still one control cycle per 2.6 cm (2026-07-10 efficiency pass).
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      # Spin-then-drive (bench feedback 2026-07-09: "it tries to back up and
      # get tripped up instead of just spinning"): the shim rotates IN PLACE
      # toward the path whenever it points >45 deg away, then hands control
      # to MPPI for the drive; it also rotates in place to the goal heading
      # at the end. MPPI's own params stay below, unchanged — the shim wraps
      # it. (The backup-after-a-BUMP is different: that's the Create 3
      # firmware reflex, always on, not nav2.)
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.785      # rotate in place beyond ~45 deg
      angular_disengage_threshold: 0.3927
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.2
      max_angular_accel: 3.2
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000  # the documented default; 2000 doubled MPPI's CPU for no recorded reason
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 1.9
      iteration_count: 1
      prune_distance: 1.7
      # 0.5 s TF margin here and in the costmaps/behaviors/collision_monitor:
      # odom->base_link crosses Wi-Fi and routinely lags 50-260 ms during AP
      # roams (2026-07-02 ramp run), which blew the 0.1-0.3 s defaults. At the
      # smoothed 0.26 m/s cap, 0.5 s of pose staleness is <=13 cm, absorbed by
      # the inflation layer. Reliability over reaction time.
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # false = circle checking, matching the costmaps' robot_radius (true
        # + robot_radius triggers "Inconsistent configuration in collision
        # checking" at bringup). Also the behavior we WANT with the oversized
        # radius: inscribed cost (253) now counts as collision, so MPPI treats
        # the whole 0.28 m bubble as a hard no-go instead of a suggestion —
        # closes the tracking-error gap that clipped feet — and it's cheaper
        # per trajectory point on the loaded laptop.
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.75
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5  # Wi-Fi TF lag margin — see FollowPath note
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.06
      # Deliberately OVERSIZED virtual radius (real shell is ~0.17 m): the
      # HARD keep-out against ANY lidar return, including a person's legs.
      # 0.25 is the MAXIMUM the building geometry allows. The binding gap is
      # NOT the 80 cm doors — it's the REAL POST mid-passage at
      # (31.9, -2.6) on the crossroads<->corridor route (the only way back
      # to the dock): the post splits a 1.55 m opening into two ~0.75 m
      # sub-gaps. Center band = gap - 2*radius:
      #   radius 0.25 -> 0.25 m band there (and 0.30 m in the 80 cm doors);
      #   radius 0.30 -> 0.15 m band -> FAILED re-entry live (2026-07-09);
      #   radius 0.40 -> doors closed, people unpassable, dock stuck.
      # Passing a person needs 2*radius of free width beside them, and the
      # undock zone (~0.5-0.6 m off the dock wall) must stay outside the
      # radius too — 0.25 satisfies all of it.
      # While DOCKED the center is ~0.2 m from the wall, inside any useful
      # radius — nav goals from the dock always fail; undock first (the
      # nodes do). Feet beyond this radius are covered by the VirtualBumper
      # slowdown ring (0.45), the soft inflation (0.5), and bump_to_cloud
      # (bumps become costmap obstacles + proximity beeps).
      # Keep both costmaps identical.
      robot_radius: 0.25
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # SOFT preference only — the ~0.5 m berth the robot gives people
        # when space allows. Zero cost beyond 0.5 m, so the dock's
        # undock/approach zone (~0.55-0.6 m off the wall) stays cost-free
        # (0.85 blanketed it and the robot couldn't leave the dock). The
        # 80 cm door centerline (0.40 from each frame) costs ~170, below
        # NavFn lethal 253 / MPPI critical_cost 300.
        cost_scaling_factor: 4.0
        inflation_radius: 0.50
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan bump_points
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        # Bumped obstacles (feet — below the lidar plane) from bump_to_cloud.
        # Marking only: the lidar sees through the air above a foot, so its
        # raytrace would clear the mark; the node republishes for ~10 s to
        # keep it alive, then the points expire on their own.
        bump_points:
          topic: bump_points
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        # OAK-D depth — feet at range (docs/oakd_feet_detection.md). To enable:
        # uncomment here AND add oakd_points to observation_sources above,
        # then start the depth->cloud pipeline from that doc.
        # min_obstacle_height 0.03 drops the floor; keep marking-only so a
        # sparse low-rate cloud can't raytrace away lidar marks.
        # oakd_points:
        #   topic: oakd_points
        #   data_type: "PointCloud2"
        #   marking: true
        #   clearing: false
        #   min_obstacle_height: 0.03
        #   max_obstacle_height: 0.5
        #   obstacle_max_range: 2.0
        #   obstacle_min_range: 0.3
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # On a docked cold start the map frame only appears after nav_to_node
      # undocks (lidar back on) and sets the initial pose. The default 60 s
      # activation timeout fired before that and aborted the whole bringup
      # (2026-06-10 16:53 run), forcing a second nav2 launch.
      initial_transform_timeout: 600.0
      transform_tolerance: 0.5  # Wi-Fi TF lag margin — see FollowPath note
      # Oversized virtual radius — sizing rationale at the local_costmap
      # robot_radius; keep the two identical.
      robot_radius: 0.25
      resolution: 0.06
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan bump_points
        scan:
          topic: scan
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        # Bumped obstacles (feet) — see the local costmap's bump_points note.
        bump_points:
          topic: bump_points
          data_type: "PointCloud2"
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Match the local costmap's soft layer — rationale there.
        cost_scaling_factor: 4.0
        inflation_radius: 0.50
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    #expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5  # Wi-Fi TF lag margin — see FollowPath note
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    enable_stamped_cmd_vel: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    # Wi-Fi TF lag margin (see FollowPath note): the 0.2/1.0 defaults made the
    # monitor stop the robot ("invalid source") on every 100-260 ms AP-roam
    # stall. 1.5 s still stops well before the patrol loop's 2 s stale-scan
    # line, and the stop remains the SAFE direction on a real outage.
    transform_tolerance: 0.5
    source_timeout: 1.5
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["VirtualBumper", "FootprintApproach"]
    # Reactive feet guard (2026-07-09). The planner's keep-out (oversized
    # footprint) only protects feet if MPPI tracks the path perfectly, and the
    # approach check only fires on a head-on collision course — lateral passes
    # still clipped feet (field: robot shell passed ~0.10 m from feet, and a
    # foot sticks ~0.05 m past the leg the lidar sees). This ring slows the
    # robot to 30% whenever ANY raw scan point (a leg, a wall) is within
    # 0.40 m of base_link — so close passes happen at ~0.08 m/s where a foot
    # contact is a nudge, not a hit. Deliberately a SLOWDOWN, not a stop: a
    # stop ring wedges against static walls/doorframes (80 cm door frames sit
    # right at ~0.40 from a centered robot), a slowdown just crawls through.
    VirtualBumper:
      type: "circle"
      radius: 0.45
      action_type: "slowdown"
      slowdown_ratio: 0.3
      min_points: 4
      visualize: True
      enabled: True
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    docks: ['home_dock']  # Input your docks here
    home_dock:
      type: 'simple_charging_dock'
      frame: map
      pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
